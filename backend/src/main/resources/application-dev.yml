spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pki_ca_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:pki_app_user}
    password: ${DB_PASSWORD:AppPassSecure123!}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: PkiHikariPool
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
